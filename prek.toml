# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
# Install the hooks once: prek install --hook-type pre-commit --hook-type commit-msg
# Run manually: prek run --all-files
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.4.3"
default_language_version.python = "3.12"

# Hooks at the same priority run concurrently; lower priorities run first, so
# the fixers finish before the checks. cargo fmt --check needs the ff-rust
# container (docker), as cargo is not installed on the host; clippy, tests and
# the ub-mode gates run in `make check` and CI.

# Spell checking.
[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.3"

[[repos.hooks]]
id = "codespell"
# datas, aare, pres, inout, datset: ASN.1/ACSE/Spicy/IEC 61850 identifiers in the ICCP parsers; edn: dryer/crapper snapshot format; mis: the PYPOWER mismatch variable; hieght: a deliberate misspelling in tests; ot: operational technology
args = ["--ignore-words-list", "edn,mis,hieght,ot,datas,aare,pres,inout,datset"]
exclude = { glob = ["Cargo.lock", "NOTICE", "tests/golden/**"] }
priority = 4

# Shell scripts.
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1-1"

[[repos.hooks]]
id = "shellcheck"
args = ["--severity=warning"]
priority = 4

# GitHub Actions security lint.
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.26.1"

[[repos.hooks]]
id = "zizmor"
args = ["--no-progress"]
priority = 4

# Enforce conventional commit messages.
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = ["feat", "fix", "docs", "style", "refactor", "test", "chore", "ci", "build", "perf"]
priority = 4

# Local hooks.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt --check (ff-rust container)"
entry = "make fmt-check"
language = "system"
types = ["rust"]
pass_filenames = false
priority = 4

# General repository hygiene checks built into prek.
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "fix-byte-order-marker"
priority = 0

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]
types_or = ["rust", "markdown", "yaml", "toml", "shell"]
priority = 1

[[repos.hooks]]
id = "end-of-file-fixer"
types_or = ["rust", "markdown", "yaml", "toml", "shell"]
priority = 1

[[repos.hooks]]
id = "check-yaml"
priority = 4

[[repos.hooks]]
id = "check-toml"
priority = 4

[[repos.hooks]]
id = "check-json"
priority = 4

[[repos.hooks]]
id = "check-merge-conflict"
priority = 4

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1024"]
priority = 4

[[repos.hooks]]
id = "check-case-conflict"
priority = 4

[[repos.hooks]]
id = "check-executables-have-shebangs"
priority = 4

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"
priority = 4

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=no"]
priority = 4
