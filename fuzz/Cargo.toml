[package]
name = "ferrofire-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferrofire = { path = ".." }
roxmltree = "0.20"
iec61850-rs = { version = "=0.4.0", default-features = false, features = ["server", "goose", "net"] }

# detach from the root crate's workspace; run with `cargo +nightly fuzz run <target>` (needs cargo-fuzz)
[workspace]

[[bin]]
name = "fd_datagram"
path = "fuzz_targets/fd_datagram.rs"
test = false
doc = false

[[bin]]
name = "fd_config"
path = "fuzz_targets/fd_config.rs"
test = false
doc = false

[[bin]]
name = "fd_dnp3"
path = "fuzz_targets/fd_dnp3.rs"
test = false
doc = false

[[bin]]
name = "fd_iec61850"
path = "fuzz_targets/fd_iec61850.rs"
test = false
doc = false

[[bin]]
name = "fd_iccp"
path = "fuzz_targets/fd_iccp.rs"
test = false
doc = false
