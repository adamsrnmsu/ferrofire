[package]
name = "ferrofire-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferrofire = { path = ".." }

# its own workspace: the fuzz crate needs nightly and must not be part of the main build
[workspace]

[[bin]]
name = "request"
path = "fuzz_targets/request.rs"
test = false
doc = false

[[bin]]
name = "datagram"
path = "fuzz_targets/datagram.rs"
test = false
doc = false

[[bin]]
name = "expr"
path = "fuzz_targets/expr.rs"
test = false
doc = false

[[bin]]
name = "model"
path = "fuzz_targets/model.rs"
test = false
doc = false
