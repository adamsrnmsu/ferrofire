[package]
name = "ferrofire-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferrofire = { path = ".." }
roxmltree = "0.20"
iec61850-rs = { version = "=0.4.0", default-features = false, features = ["server", "goose", "net"] }

# its own workspace: the fuzz crate needs nightly and must not be part of the main build; run with `cargo +nightly fuzz run <target>`
[workspace]

[[bin]]
name = "request"
path = "fuzz_targets/request.rs"
test = false
doc = false

[[bin]]
name = "datagram"
path = "fuzz_targets/datagram.rs"
test = false
doc = false

[[bin]]
name = "expr"
path = "fuzz_targets/expr.rs"
test = false
doc = false

[[bin]]
name = "model"
path = "fuzz_targets/model.rs"
test = false
doc = false

[[bin]]
name = "fd_datagram"
path = "fuzz_targets/fd_datagram.rs"
test = false
doc = false

[[bin]]
name = "fd_config"
path = "fuzz_targets/fd_config.rs"
test = false
doc = false

[[bin]]
name = "fd_dnp3"
path = "fuzz_targets/fd_dnp3.rs"
test = false
doc = false

[[bin]]
name = "fd_iec61850"
path = "fuzz_targets/fd_iec61850.rs"
test = false
doc = false

[[bin]]
name = "fd_iccp"
path = "fuzz_targets/fd_iccp.rs"
test = false
doc = false
