[package]
name = "ferrofire"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Simple process (and, later, power-flow) simulator for sceptre/phenix ranges"

[dependencies]
libc = "0.2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
zeromq = "0.7"
tokio = { version = "1", default-features = false, features = ["rt", "time", "net"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }

[profile.release]
opt-level = 2
strip = true

[dev-dependencies]
serde_json = "1"
insta = "1"
# libzmq (built from source) is the stock-bennu stand-in the interop tests talk to; the shipped binary has none
zmq = { version = "0.10" }

# the golden power-flow tests solve 300-bus cases with a dense LU; keep them quick in debug builds
[profile.dev]
opt-level = 2
