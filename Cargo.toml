[package]
name = "ferrofire"
version = "0.1.1"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Simple process (and, later, power-flow) simulator for sceptre/phenix ranges"

[dependencies]
libc = "0.2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
zeromq = "0.7"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
roxmltree = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "sync", "io-util", "macros"] }
tokio-util = { version = "0.7", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
# IEC 61850 / MMS (MIT OR Apache-2.0, sans-IO, no unsafe). Pre-1.0 and every minor breaks, hence the exact pin (spike: bead ww-otj.45).
iec61850-rs = { version = "=0.4.0", default-features = false, features = ["server", "goose", "net"], optional = true }

# MQTT 3.1.1/5 client (Apache-2.0); TLS through rustls. Sparkplug B payloads are prost messages derived by hand in src/fd/proto/mqtt/sparkplug.rs.
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
prost = { version = "0.14", default-features = false, features = ["derive", "std"], optional = true }

# Elasticsearch / OpenSearch export (src/elastic, src/groundtruth): a small HTTP/1.1 client over rustls (ring); roots from a CA file or the OS store.
serde_json = { version = "1", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
base64 = { version = "0.23", optional = true }

[features]
# One feature per protocol module (docs/field-device-protocols-plan.md section 2). The parity set is default; extras are opt-in.
# proto-mqtt is the exception: the quality gates (crap, mutate) build the default features only, and deny.toml carries advisory ignores
# for rumqttc's unused webpki 0.102 (bead ww-otj.56 follow-up: drop both once rumqttc moves on). Build without it: --no-default-features.
default = ["proto-modbus", "proto-dnp3", "proto-iec104", "proto-bacnet", "proto-serial", "proto-iec61850", "proto-iccp", "proto-mqtt", "proto-scpi", "elastic"]
proto-modbus = []
proto-dnp3 = []
proto-iec104 = []
proto-bacnet = []
proto-serial = []
proto-iec61850 = ["dep:iec61850-rs"]
proto-iccp = ["dep:iec61850-rs"]
proto-mqtt = ["dep:rumqttc", "dep:prost", "dep:rustls"]
# default-on like proto-mqtt: the crap and mutate gates build the default features only
proto-scpi = []
# default-on for the same reason: groundtruth monitor and the provider [elastic] export
elastic = ["dep:rustls", "dep:rustls-native-certs", "dep:serde_json", "dep:base64"]
all-protocols = ["default", "proto-iec61850", "proto-iccp"]

[profile.release]
opt-level = 2
strip = true

[dev-dependencies]
serde_json = "1"
insta = "1"
# libzmq (built from source) is the stock-bennu stand-in the interop tests talk to; the shipped binary has none
zmq = { version = "0.10" }
# an independent Modbus/TCP client for tests/modbus_clients.rs (MIT OR Apache-2.0)
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp"] }
# the crate's own MMS client is the peer of the in-process tests (tests/iec61850_net.rs)
iec61850-rs = { version = "=0.4.0", default-features = false, features = ["client", "server", "goose"] }

# the golden power-flow tests solve 300-bus cases with a dense LU; keep them quick in debug builds
[profile.dev]
opt-level = 2

# iec61850-rs 0.4.0 plus one fix (Initiate nesting level negotiated up); see third_party/iec61850-rs/PATCHES.md. Remove when upstream releases it.
[patch.crates-io]
iec61850-rs = { path = "third_party/iec61850-rs" }
