[package]
name = "ferrofire"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Simple process (and, later, power-flow) simulator for sceptre/phenix ranges"

[dependencies]
libc = "0.2"
zmq = { version = "0.10", optional = true }
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
nng = { version = "1", optional = true }

[profile.release]
opt-level = 2
strip = true

[dev-dependencies]
serde_json = "1"

# transports (provider-spec 11): both by default; an image may build with one only
[features]
default = ["zmq", "nng"]
zmq = ["dep:zmq"]
nng = ["dep:nng"]

# the golden power-flow tests solve 300-bus cases with a dense LU; keep them quick in debug builds
[profile.dev]
opt-level = 2
