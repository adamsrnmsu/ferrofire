<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Stock bennu leaks a socket per Modbus connection and stops at 1 006; the fix holds at 5">
<title>Stock bennu leaks a socket per Modbus connection and stops at 1 006; the fix holds at 5</title><desc>Open sockets of the Modbus field device against connections opened and closed, stock bennu against the fixed build.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--stock:#898781;--fixed:#6250d6}
@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#383835;--stock:#898781;--fixed:#9085e9}}
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;fill:var(--ink)}
.t{font-size:15px;font-weight:700}.s{fill:var(--ink2)}.m{fill:var(--muted);font-size:11px}.b{font-weight:600}
.grid{stroke:var(--grid);stroke-width:1}.stock{fill:var(--stock)}.fixed{fill:var(--fixed)}
.ring{stroke:var(--surface);stroke-width:2}.bad{fill:#d03b3b}.good{fill:#0ca30c}
.ic{stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="760" height="420" fill="var(--surface)"/>
<text class="t" x="24" y="32">Stock bennu leaks a socket per Modbus connection and stops at 1 006; the fix holds at 5</text>
<text class="s" x="24" y="52">Open sockets before and after a connect/close storm (1.00 sockets leaked per connection on stock)</text>
<line class="grid" x1="64" x2="720" y1="340.0" y2="340.0"/>
<text x="56.0" y="344.0" class="s" text-anchor="end">0</text>
<line class="grid" x1="64" x2="720" y1="281.8" y2="281.8"/>
<text x="56.0" y="285.8" class="s" text-anchor="end">250</text>
<line class="grid" x1="64" x2="720" y1="223.6" y2="223.6"/>
<text x="56.0" y="227.6" class="s" text-anchor="end">500</text>
<line class="grid" x1="64" x2="720" y1="165.5" y2="165.5"/>
<text x="56.0" y="169.5" class="s" text-anchor="end">750</text>
<line class="grid" x1="64" x2="720" y1="107.3" y2="107.3"/>
<text x="56.0" y="111.3" class="s" text-anchor="end">1 000</text>
<text x="64.0" y="358.0" class="s" text-anchor="middle">0</text>
<text x="282.7" y="358.0" class="s" text-anchor="middle">500</text>
<text x="501.3" y="358.0" class="s" text-anchor="middle">1 000</text>
<text x="720.0" y="358.0" class="s" text-anchor="middle">1 500</text>
<text x="392.0" y="378.0" class="s" text-anchor="middle">Modbus connections opened and closed</text>
<text x="16.0" y="74.0" class="s">open sockets of the field device</text>
<line x1="64" x2="720" y1="101.7" y2="101.7" stroke="#d03b3b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="720.0" y="95.7" class="s" text-anchor="end">fd soft limit 1 024</text>
<g><title>stock bennu: 6 to 1 011 sockets over 1 006 connections (quoted)</title><line x1="64.0" y1="338.6" x2="504.0" y2="104.7" stroke="var(--stock)" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
<circle class="stock ring" cx="64.0" cy="338.6" r="5"/><circle class="stock ring" cx="504.0" cy="104.7" r="5"/></g>
<g><title>bennu + fix: 5 to 5 sockets over 1 500 connections</title><line x1="64.0" y1="338.8" x2="720.0" y2="338.8" stroke="var(--fixed)" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
<circle class="fixed ring" cx="64.0" cy="338.8" r="5"/><circle class="fixed ring" cx="720.0" cy="338.8" r="5"/></g>
<text x="518.0" y="128.7" class="b">stock bennu</text>
<text x="518.0" y="143.7" class="s">6 → 1 011 sockets, stops answering</text>
<text x="518.0" y="158.7" class="s">at connection 1 006; +240 MB of stderr</text>
<text x="518.0" y="173.7" class="m">quoted from PR #79 comment, no raw file</text>
<text x="720.0" y="296.8" class="b" text-anchor="end">bennu + fix (PR #79)</text>
<text x="720.0" y="311.8" class="s" text-anchor="end">5 → 5 sockets, 1 500 of 1 500 done,</text>
<text x="720.0" y="326.8" class="s" text-anchor="end">still answering</text>
<text x="24.0" y="396.0" class="m">Dotted connectors join the two measured endpoints of each run; nothing was sampled in between.</text>
<text x="24.0" y="412.0" class="m">One board run per build, live waterway-arm64 range, 2026-11-10.</text>
</svg>
