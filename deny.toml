# cargo-deny: licences, advisories, bans. Run by `make deny` (part of `make check`) and CI.
# The PSERC BSD-3 code in src/power is ported source, not a crate; it is attributed in NOTICE, so it is not listed here.
[graph]
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[advisories]
yanked = "deny"
# rumqttc 0.25.1 (the latest release, ww-otj.56) depends on rustls-webpki 0.102.8 only for the `webpki::Error` variant of its TLS error
# type and on rustls-pemfile only to read PEM files. Certificate verification is done by rustls 0.23, which uses the patched
# rustls-webpki 0.103.x (both are in the lockfile), so the five webpki advisories below concern code that is linked but never called.
# Remove these when rumqttc moves to webpki 0.103 and rustls-pki-types' PEM parser.
ignore = [
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained
    "RUSTSEC-2026-0049", # rustls-webpki 0.102.8: CRL matching
    "RUSTSEC-2026-0098", # rustls-webpki 0.102.8: URI name constraints
    "RUSTSEC-2026-0099", # rustls-webpki 0.102.8: wildcard name constraints
    "RUSTSEC-2026-0104", # rustls-webpki 0.102.8: CRL parsing panic
    "RUSTSEC-2026-0382", # rustls-webpki 0.102.8: distrusted intermediates
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
