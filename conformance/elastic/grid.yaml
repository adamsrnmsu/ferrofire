# A small model with a frequency tag, for the elastic conformance run: a pump fills a tank that drains through an orifice, on a 60 Hz grid.
version: 1
dt: 0.1
inputs:
  grid.frequency: {type: analog, default: 60.0, units: Hz}
  pump.run:       {type: binary, default: true}
  valve.open:     {type: analog, default: 0.5, min: 0, max: 1, units: fraction}
states:
  tank.level: {ode: "(pump.flow - valve.flow) / 50", init: 2.0, min: 0, max: 10, units: m}
outputs:
  pump.flow:  {type: analog, expr: "pump.run ? 0.5 : 0", units: m3/s}
  valve.flow: {type: analog, expr: "valve.open * 0.3 * sqrt(max(tank.level, 0))", units: m3/s}
  tank.level: {type: analog}
  grid.freq:  {type: analog, expr: "grid.frequency", units: Hz}
  pump.on:    {type: binary, expr: "pump.run"}
