# GPT: 1 efi (GRUB + kernel), 2 rootfs (phenix inject_partition: 2), 3 data (empty, mounted rw at /data).
image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}
		file Image {
			image = "Image"
		}
	}
	size = 64M
}

image data.ext4 {
	empty = true
	ext4 {
		label = "data"
	}
	size = 128M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition efi {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 32K
		bootable = true
	}

	partition rootfs {
		partition-type-uuid = b921b045-1df0-41c3-af44-4c6f280d3fae
		image = "rootfs.ext2"
	}

	partition data {
		partition-type-uuid = L
		image = "data.ext4"
	}
}
